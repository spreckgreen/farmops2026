services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        # UID/GID default to 1001; override below or via .env to match host user
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Force the Nitro node-server to bind to all interfaces on port 3000 so
      # the published port is actually reachable from the host. Without HOST=
      # 0.0.0.0 some Nitro presets bind to 127.0.0.1 and the container looks
      # "active" but nothing renders in the browser.
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      # Supabase credentials — required for the app to function. Provide them
      # via a .env file or export them in your shell before running compose.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-}

      # Runtime UID/GID — the entrypoint re-maps appuser and chowns declared
      # mount points so bind-mounts "just work". Defaults below work without
      # a .env file; override only if you need them to match your host user.
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      # Space-separated paths to chown on startup. These defaults cover the
      # most common bind-mount targets. Set to "" to disable, or override.
      CHOWN_PATHS: ${CHOWN_PATHS:-/app/data /app/uploads}
      # Set to "1" to skip chown entirely (faster startup once permissions
      # are already correct). Leave unset to let the entrypoint fix ownership.
      # SKIP_CHOWN: "1"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      # Surfaces the unified install log on the host at ./logs/install.log
      # so build-time failures are visible without `docker cp`. The
      # entrypoint copies /app/install.log into this mount on container start.
      - ./logs:/var/log/bostead

    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
