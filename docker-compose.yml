services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        # UID/GID default to 1001; override below or via .env to match host user
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    # No host port binding: Caddy terminates TLS on :443 and proxies to app:3000
    # over the compose network. Uncomment to expose the app directly for debugging.
    # ports:
    #   - "3000:3000"
    expose:
      - "3000"
    # Load both env files at the service level so `docker compose up` picks up
    # .env.local even when invoked directly (without COMPOSE_ENV_FILES). Later
    # files win, so .env.local overrides .env. `required: false` prevents a
    # hard error when one file is absent on a fresh checkout.
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: "3000"
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-}

      # Vault bootstrap keys are inherited from the env_file entries above.
      # Do not repeat them here with ${...} interpolation: Compose resolves
      # that before env_file loading and an unset host value would overwrite
      # the valid .env.local value with an empty string.

      # --- AI routing ---------------------------------------------------------
      # By default, self-hosted installs use the bundled Ollama service below
      # (llama3.2:3b, ~2GB, fully offline). Override any of these in .env to
      # point at OpenAI, OpenRouter, or the Lovable AI Gateway instead.
      CUSTOM_AI_BASE_URL: ${CUSTOM_AI_BASE_URL:-http://ollama:11434/v1}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-ollama}
      CUSTOM_AI_MODEL: ${CUSTOM_AI_MODEL:-llama3.2:3b}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      SELF_HOST_MODE: ${SELF_HOST_MODE:-true}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}

      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      CHOWN_PATHS: ${CHOWN_PATHS:-/app/data /app/uploads}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/var/log/bostead
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # --- Bundled small-model AI (fully offline, no API keys) --------------------
  # Ollama serves an OpenAI-compatible /v1 endpoint that the app talks to via
  # CUSTOM_AI_BASE_URL above. Model weights persist in the `ollama` named
  # volume so the ~2GB download only happens on first boot.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Expose 11434 on the host only if you want to hit Ollama directly for
    # debugging. The app reaches it over the compose network as `ollama:11434`.
    # ports:
    #   - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 5s

  # One-shot init: pulls the small model on first boot, then exits.
  # `app` waits for this to complete successfully before starting, so the
  # first AI call never races the model download.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${CUSTOM_AI_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # $$ escapes compose interpolation so the shell (not docker compose)
        # expands OLLAMA_MODEL at runtime from the container's environment.
        echo "=== [ollama-pull] Ensuring model $${OLLAMA_MODEL} is present ==="
        if ollama list | awk '{print $$1}' | grep -qx "$${OLLAMA_MODEL}"; then
          echo "=== [ollama-pull] Model already present, skipping download ==="
        else
          echo "=== [ollama-pull] Pulling $${OLLAMA_MODEL} (first boot only, ~2GB) ==="
          ollama pull "$${OLLAMA_MODEL}"
        fi
        echo "=== [ollama-pull] Done ==="

    restart: "no"

  # --- Reverse proxy + automatic ACME/Let's Encrypt TLS -----------------------
  # Fronts the app on :80/:443, obtains and renews certs for ACME_DOMAIN
  # (e.g. farmops.bostead.life) via the HTTP-01 challenge. Requires public
  # DNS pointing at this host and ports 80/443 open to the internet.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    # Let the caddy container reach the Supabase Kong published on the host
    # (0.0.0.0:8000) via host.docker.internal. Required on Linux; no-op on
    # Docker Desktop where the alias resolves automatically.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ACME_DOMAIN: ${ACME_DOMAIN:-farmops.bostead.life}
      ACME_EMAIL: ${ACME_EMAIL:-admin@bostead.life}
      SUPABASE_DOMAIN: ${SUPABASE_DOMAIN:-supabase.farmops.bostead.life}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certs + ACME account (persist across restarts)
      - caddy_config:/config


volumes:
  ollama:
  caddy_data:
  caddy_config:
