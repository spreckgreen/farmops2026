services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
        # UID/GID default to 1001; override below or via .env to match host user
        UID: ${UID:-1001}
        GID: ${GID:-1001}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID}
      # Runtime UID/GID — the entrypoint re-maps appuser and chowns declared
      # mount points so bind-mounts "just work".
      PUID: ${PUID:-1001}
      PGID: ${PGID:-1001}
      # Space-separated paths to chown on startup. Defaults to "/app/data /app/uploads".
      # Set to "" to disable defaults, or "1" to skip chown entirely for faster restarts.
      # CHOWN_PATHS: "/app/data /app/uploads"
      # SKIP_CHOWN: "1"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
