name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Re-scan weekly so new advisories against unchanged deps still fail CI.
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    name: bun audit (fail on high)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit (high+critical)
        run: |
          set -o pipefail
          bun audit \
            --json \
            --audit-level=high \
            --ignore GHSA-5p2g-fcmc-qvqq \
            --ignore GHSA-w3rx-r6r6-pgpr \
            | tee npm-audit.json
          # `bun audit` exits non-zero when any finding at the requested level exists.

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
