name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Re-scan weekly so new advisories against unchanged deps still fail CI.
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    name: bun audit (fail on high)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit (high+critical)
        run: |
          set -o pipefail
          bun audit --json --audit-level=high | tee bun-audit.json
          # `bun audit` exits non-zero when any finding at the requested level exists.

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-audit-report
          path: bun-audit.json

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Check code scanning availability
        id: code-scanning
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try {
              await github.request("GET /repos/{owner}/{repo}/code-scanning/default-setup", {
                owner,
                repo,
              });
              core.setOutput("enabled", "true");
            } catch (error) {
              const message = String(error?.message ?? error?.response?.data?.message ?? "");
              if (
                error?.status === 404 &&
                message.includes("Code scanning is not enabled for this repository")
              ) {
                core.notice("Code scanning is not enabled for this repository; skipping CodeQL analysis.");
                core.setOutput("enabled", "false");
                return;
              }
              throw error;
            }
      - uses: github/codeql-action/init@v3
        if: steps.code-scanning.outputs.enabled == 'true'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        if: steps.code-scanning.outputs.enabled == 'true'
        with:
          category: "/language:javascript-typescript"
      - name: CodeQL skipped
        if: steps.code-scanning.outputs.enabled != 'true'
        run: echo "Code scanning is not enabled for this repository; skipping CodeQL."
