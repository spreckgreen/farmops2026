name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Re-scan weekly so new advisories against unchanged deps still fail CI.
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    name: bun audit (fail on high)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Bun audit (high+critical)
        run: |
          set -o pipefail
          bun audit --json --audit-level=high | tee bun-audit.json
          # `bun audit` exits non-zero when any finding at the requested level exists.

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-audit-report
          path: bun-audit.json

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Check code scanning availability
        id: code-scanning
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const setEnabled = (value) => core.setOutput("enabled", value ? "true" : "false");

            try {
              const repoInfo = await github.request("GET /repos/{owner}/{repo}", {
                owner,
                repo,
              });

              const security = repoInfo?.data?.security_and_analysis ?? {};
              const statusValues = [
                security?.advanced_security?.status,
                security?.code_security?.status,
                security?.code_scanning?.status,
              ].filter((value) => typeof value === "string");

              if (statusValues.includes("enabled")) {
                setEnabled(true);
                return;
              }

              if (statusValues.length > 0 && !statusValues.includes("enabled")) {
                core.notice("Code scanning is not enabled for this repository; skipping CodeQL analysis.");
                setEnabled(false);
                return;
              }
            } catch (error) {
              if (error?.status === 401 || error?.status === 403) {
                throw error;
              }
            }

            try {
              await github.request("GET /repos/{owner}/{repo}/code-scanning/alerts", {
                owner,
                repo,
                per_page: 1,
              });
              setEnabled(true);
            } catch (error) {
              const message = String(error?.response?.data?.message ?? error?.message ?? "");
              const codeScanningDisabled =
                error?.status === 404 ||
                (error?.status === 403 && message.includes("Code scanning is not enabled for this repository"));

              if (codeScanningDisabled) {
                core.notice("Code scanning is not enabled for this repository; skipping CodeQL analysis.");
                setEnabled(false);
                return;
              }
              throw error;
            }
      - uses: github/codeql-action/init@v3
        if: steps.code-scanning.outputs.enabled == 'true'
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        if: steps.code-scanning.outputs.enabled == 'true'
        with:
          category: "/language:javascript-typescript"
      - name: CodeQL skipped
        if: steps.code-scanning.outputs.enabled != 'true'
        run: echo "Code scanning is not enabled for this repository; skipping CodeQL."
