name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Re-scan weekly so new advisories against unchanged deps still fail CI.
    - cron: "0 6 * * 1"

jobs:
  npm-audit:
    name: npm audit (fail on high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun has no audit yet; use npm against the existing lockfile.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run npm audit (high+critical)
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json | tee npm-audit.json
          # `npm audit` exits non-zero when any finding at the requested level exists.

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json

  codeql:
    name: CodeQL static analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
