name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  scan-supabase-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan all tracked files for Supabase key leaks
        run: |
          chmod +x scripts/scan-secrets.sh
          ./scripts/scan-secrets.sh --all
