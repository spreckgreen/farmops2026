name: Docker Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare log output dir
        run: mkdir -p ./logs

      - name: Build image (capture install log on failure)
        id: build
        run: |
          set -o pipefail
          # Build with a named target so we can extract the install log even on failure.
          # BuildKit must be enabled (default for buildx).
          docker buildx build \
            --progress=plain \
            --load \
            --tag bostead:ci \
            --output type=docker \
            . 2>&1 | tee ./logs/docker-build.log
        continue-on-error: false

      # Always attempt to recover /app/install.log from the image (or last stage cache)
      # so the artifact upload has something to publish even when the build failed.
      - name: Extract install.log from image
        if: always()
        run: |
          set +e
          mkdir -p ./logs
          # Try the tagged image first (success path).
          if docker image inspect bostead:ci >/dev/null 2>&1; then
            cid=$(docker create bostead:ci)
            docker cp "$cid:/app/install.log" ./logs/install.log 2>/dev/null || \
              echo "install.log not present in final image" > ./logs/install.log.missing
            docker rm -f "$cid" >/dev/null 2>&1 || true
          fi
          # On failure, BuildKit keeps intermediate layers; surface the build transcript.
          if [ ! -f ./logs/install.log ] && [ -f ./logs/docker-build.log ]; then
            cp ./logs/docker-build.log ./logs/install.log
          fi
          ls -la ./logs/ || true

      - name: Upload install log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-install-log
          path: |
            logs/install.log
            logs/docker-build.log
            logs/install.log.missing
          if-no-files-found: warn
          retention-days: 14
